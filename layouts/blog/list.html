{{ define "main" }}
  <section class="page container">
    <header class="page-header">
      <h1>{{ .Title }}</h1>
    </header>
    <div class="prose">
      {{ .Content }}
    </div>
    <div class="item-list">
      {{ range .Pages.ByDate.Reverse }}
        <article class="list-item">
          <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
          <p class="meta">{{ .Date.Format "Jan 2, 2006" }}</p>
          {{ with .Description }}<p>{{ . }}</p>{{ end }}
        </article>
      {{ end }}
    </div>
  </section>
{{ end }}
