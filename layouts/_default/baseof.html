<!doctype html>
<html lang="{{ .Language.Locale | default "en" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {{ partial "nav.html" . }}
    <main id="main">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{ $script := resources.Get "js/site.js" | minify | fingerprint }}
    <script src="{{ $script.RelPermalink }}" defer></script>
  </body>
</html>
