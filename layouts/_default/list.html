{{ define "main" }}
  <section class="page container">
    <header class="page-header">
      <h1>{{ .Title }}</h1>
    </header>
    <div class="prose">
      {{ .Content }}
    </div>
    {{ if .Pages }}
      <div class="item-list">
        {{ range .Pages }}
          <article class="list-item">
            <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
            {{ with .Description }}<p>{{ . }}</p>{{ end }}
          </article>
        {{ end }}
      </div>
    {{ end }}
  </section>
{{ end }}
